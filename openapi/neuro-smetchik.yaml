          anyOf:
          - type: integer
          - type: 'null'
          title: Version
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                title: Response Get Estimate Api V1 Estimates  Smeta Id  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
