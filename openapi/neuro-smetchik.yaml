openapi: 3.1.0
info:
  title: Нейро-сметчик API
  description: Локальная система поддержки составления смет. Human-in-the-loop, Decimal-расчёты,
    immutable-версии, трассировка trace_id, Prompt Version Control, защита от prompt
    injection. Данные не покидают периметр.
  version: 1.1.0-mvp
paths:
  /api/v1/health:
    get:
      tags:
      - system
      summary: Проверка доступности и локальности контура
      operationId: health_api_v1_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                title: Response Health Api V1 Health Get
  /api/v1/meta:
    get:
      tags:
      - system
      summary: Конфигурация порогов и справочники для UI
      operationId: meta_api_v1_meta_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                title: Response Meta Api V1 Meta Get
  /api/v1/requests:
    post:
      tags:
      - pipeline
      summary: Создать черновик сметы (User Flow 3.1)
      operationId: create_request_api_v1_requests_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestIn'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                title: Response Create Request Api V1 Requests Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/clarification/{session_id}/answer:
    post:
      tags:
      - clarification
      summary: Ответ/пропуск в Clarification Loop с пересчётом версии
      operationId: clarification_answer_api_v1_clarification__session_id__answer_post
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          title: Session Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClarificationIn'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                title: Response Clarification Answer Api V1 Clarification  Session
                  Id  Answer Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/clarification/{session_id}/timeout:
    post:
      tags:
      - clarification
      summary: Таймаут ожидания сметчика -> уведомление + отложенная обработка
      operationId: clarification_timeout_api_v1_clarification__session_id__timeout_post
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          title: Session Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                title: Response Clarification Timeout Api V1 Clarification  Session
                  Id  Timeout Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/estimates:
    get:
      tags:
      - estimates
      summary: Список смет
      operationId: estimates_api_v1_estimates_get
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 50
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
