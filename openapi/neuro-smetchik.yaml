components:
  schemas:
    Body_vision_upload_api_v1_vision_post:
      properties:
        file:
          type: string
          format: binary
          title: File
      type: object
      required:
      - file
      title: Body_vision_upload_api_v1_vision_post
    ClarificationIn:
      properties:
        answer:
          type: string
          title: Answer
          default: ''
        skip:
          type: boolean
          title: Skip
          default: false
      type: object
      title: ClarificationIn
    FeedbackIn:
      properties:
        rating:
          type: integer
          maximum: 5.0
          minimum: 1.0
          title: Rating
          default: 5
        comment:
          type: string
          title: Comment
          default: ''
        correction_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Correction Id
      type: object
      title: FeedbackIn
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    PlanFactIn:
      properties:
        fact_total:
          type: string
          title: Fact Total
        notes:
          type: string
          title: Notes
          default: ''
      type: object
      required:
      - fact_total
      title: PlanFactIn
    PromptActionIn:
      properties:
        service:
          type: string
          title: Service
        version:
          type: string
          title: Version
        canary_percent:
          type: integer
          title: Canary Percent
          default: 0
      type: object
      required:
      - service
      - version
      title: PromptActionIn
    PromptIn:
      properties:
        service:
          type: string
          title: Service
        body:
          type: string
          title: Body
        author:
          type: string
          title: Author
          default: estimator
        canary_percent:
          type: integer
          title: Canary Percent
          default: 0
        activate:
          type: boolean
          title: Activate
          default: false
      type: object
      required:
      - service
      - body
      title: PromptIn
    RequestIn:
      properties:
        text:
          type: string
          maxLength: 8000
          minLength: 3
          title: Text
          description: Запрос на естественном языке
        client:
          type: string
          title: Client
          default: ''
        source_type:
          type: string
          enum:
          - text
          - voice
          - photo
