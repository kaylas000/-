# Минимальная конфигурация Prometheus для docker-compose (профиль monitoring).
global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  - job_name: neuro-smetchik
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
    scrape_timeout: 10s

  - job_name: vllm
    metrics_path: /metrics
    static_configs:
      - targets: ["vllm:8000"]
    scrape_timeout: 10s
